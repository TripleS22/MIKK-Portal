# RESEND_FROM_EMAIL masih pakai onboarding@resend.dev (domain uji bawaan
# Resend, sudah dites terkirim sungguhan) -- BUKAN domain sendiri, karena
# MIKK belum memverifikasi domain di dashboard Resend. Ganti ke
